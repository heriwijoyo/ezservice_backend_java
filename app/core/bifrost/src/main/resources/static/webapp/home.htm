<script type="text/javascript">
    var EzApiUrl = {
        GET_APP_DATA: 'api/getAppData.json',
        GET_DASHBOARD_DATA: 'api/getDashboardData.json'
    };
    var EzWebAppBizService = {
        handleAppData: function(response) {
            $('#app-info-name').html(response.data.orgName);
            $('#user-info-name').html('<b>'+response.data.memberName+'</b>');
            $('#user-info-phone').html('<b>'+response.data.memberPhone+'</b>');

            for (let i = 0; i < response.data.menu.length; i++) {
                let menu = $.parseHTML(EzWebAppHTMLTemplate.leftMenu);
                $(menu).find('#left-menu-url').attr('href', response.data.menu[i].menuUrl);
                $(menu).find('#left-menu-name').html(response.data.menu[i].menuName);
                $(menu).find('#left-menu-icon').html(response.data.menu[i].menuIcon);
                $('#left-menu-container').append(menu);
            }
            EzWebAppClient.callApiService(EzApiUrl.GET_DASHBOARD_DATA, {});
        },
        handleDashboardData: function(response) {
            for (let i=0; i<response.data.length; i++) {
                let dashboard = $.parseHTML(EzWebAppHTMLTemplate.dashboard);
                console.log(dashboard);
                $(dashboard).attr('href', response.data[i].url);
                $(dashboard).find('#dashboard-name').html(response.data[i].displayName);
                $(dashboard).find('#dashboard-icon').html(response.data[i].icon);
                $(dashboard).find('#dashboard-label').html(response.data[i].countValue +' '+ response.data[i].countLabel);
                $('#dashboard-container').append(dashboard);
            }
        }
    };
    var EzWebAppClient = {
        sessionIdCookieName: 'EzWebappCookieSessionId',
        modalScene: '',
        start: function() {
            EzWebAppClient.startElementListener();
            EzWebAppClient.callApiService(EzApiUrl.GET_APP_DATA, {});
        },
        startElementListener: function() {
            $('#common-modal-close').click(function(){
                $('#common-modal').removeClass('show');
                $('#common-modal').addClass('fade');
                EzWebAppClient.onModalClose();
            });
        },
        callApiService: function(url, data) {
            let sessionId = EzWebAppClient.getSessionId();
            if (sessionId.length == 32) {
                data.sessionId = sessionId;
                EzWebAppClient.callApi(url, data);
            } else {
                EzWebAppClient.showModalAlert('SESSION_EXPIRED');
            }
        },
        handleApiSuccessResult: function(url, data) {
            if (url === EzApiUrl.GET_APP_DATA) {
                EzWebAppBizService.handleAppData(data);
            }
            if (url === EzApiUrl.GET_DASHBOARD_DATA) {
                EzWebAppBizService.handleDashboardData(data);
            }
        },
        handleApiFailedResult: function(url, message) {
            console.log('handleApiFailedResult - url: ' + url + ', message: ' + message);
        },
        callApi: function(url, data) {
            $.ajax({
                type: 'POST',
                url: url,
                data: data,
                success: function(response) {
                    EzWebAppClient.apiCallSuccessHandler(url, response);
                },
                error: function(xhr) {
                    EzWebAppClient.apiCallErrorHandler(xhr);
                }
            });
        },
        apiCallSuccessHandler: function(url, respData) {
            //console.log(response);
            //let respData = jQuery.parseJSON(response);
            if (respData.sessionExpired) {
                EzWebAppClient.showModalAlert('SESSION_EXPIRED');
            } else {
                if (respData.success) {
                    EzWebAppClient.handleApiSuccessResult(url, respData);
                } else {
                    EzWebAppClient.handleApiFailedResult(url, respData.message);
                }
            }
        },
        apiCallErrorHandler: function(url, xhr) {
            alert('API call error for URL: ' + url);
        },
        showModalAlert: function(scene) {
            EzWebAppClient.modalScene = scene;
            if (scene === 'SESSION_EXPIRED') {
                $('#common-modal-title').html('Application Error');
                $('#common-modal-message').html('Login session has been expired, please re-login');
            }
            $('#common-modal').removeClass('fade');
            $('#common-modal').addClass('show');
        },
        onModalClose: function() {
            if (EzWebAppClient.modalScene === 'SESSION_EXPIRED') {
                EzWebAppClient.removeSessionCookie();
                window.location.replace('login.htm');
            }
        },
        getSessionId: function() {
            let name = EzWebAppClient.sessionIdCookieName + "=";
            let decodedCookie = decodeURIComponent(document.cookie);
            let ca = decodedCookie.split(';');
            for(let i = 0; i <ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(name) == 0) {
                    return c.substring(name.length, c.length);
                }
            }
            return "";
        },
        removeSessionCookie: function() {
            document.cookie = EzWebAppClient.sessionIdCookieName +'=; Path=/webapp; Expires=Thu, 01 Jan 1970 00:00:01 GMT;';
        }
    };

    $(document).ready(function(){
        EzWebAppClient.start();

        // Basic
        $('.dropify').dropify();

        $('.dropify-image').dropify({
            messages: {
                default : '<center>Drag and drop a image here or click</center>',
                error   : 'Ooops, something wrong appended.'
            },
            error: {
                'fileSize': '<center>The file size is too big broo ({{ value }} max).</center>',
                'minWidth': '<center>The image width is too small ({{ value }}}px min).</center>',
                'maxWidth': '<center>The image width is too big ({{ value }}}px max).</center>',
                'minHeight': '<center>The image height is too small ({{ value }}}px min).</center>',
                'maxHeight': '<center>The image height is too big ({{ value }}px max).</center>',
                'imageFormat': '<center>The image format is not allowed ({{ value }} only).</center>',
                'fileExtension': '<center>The file is not allowed ({{ value }} only).</center>'
            },
        });

        $('.dropify-pdf').dropify({
            messages: {
                default: '<center>Drag and drop a <b>PDF</b> here or click</center>'
            }
        });

        $('.dropify-video').dropify({
            messages: {
                default: '<center>Drag and drop a video here or click</center>'
            }
        });

        $('.dropify-notification').dropify({
            messages: {
                default : '<center>Drag and drop a image here or click<br>(Optional)</center>',
            }
        });

        // Used events
        var drEvent = $('#input-file-events').dropify();

        drEvent.on('dropify.beforeClear', function(event, element){
            return confirm("Do you really want to delete \"" + element.file.name + "\" ?");
        });

        drEvent.on('dropify.afterClear', function(event, element){
            alert('File deleted');
        });

        drEvent.on('dropify.errors', function(event, element){
            console.log('Has Errors');
        });

        var drDestroy = $('#input-file-to-destroy').dropify();
        drDestroy = drDestroy.data('dropify')
        $('#toggleDropify').on('click', function(e){
            e.preventDefault();
            if (drDestroy.isDropified()) {
                drDestroy.destroy();
            } else {
                drDestroy.init();
            }
        })
    });

    var EzWebAppHTMLTemplate = {
        leftMenu: ''+
            '<li class="active">' +
                '<a id="left-menu-url" href="">' +
                    '<i id="left-menu-icon" class="material-icons"></i>' +
                    '<span id="left-menu-name"></span>' +
                '</a>' +
            '</li>',
        dashboard: ''+
            '<a href="">'+
                '<div class="col-lg-3 col-md-3 col-sm-6 col-xs-12">'+
                    '<div class="card corner-radius demo-color-box bg-blue waves-effect col-lg-12 col-md-12 col-sm-12 col-xs-12">'+
                        '<br>'+
                        '<div id="dashboard-name" class="color-name uppercase"></div>'+
                        '<div class="color-name"><i id="dashboard-icon" class="material-icons"></i></div>'+
                        '<div id="dashboard-label" class="color-class-name">Total 9 item</div>'+
                        '<br>'+
                    '</div>'+
                '</div>'+
            '</a>'
    };
</script>
