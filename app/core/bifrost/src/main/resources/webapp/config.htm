<section class="content">
    <ol class="breadcrumb breadcrumb-offset">
        <li class="active">System Config</li>
    </ol>

    <div class="container-fluid">
        <div class="row clearfix">
            <div class="col-lg-3 col-md-3 col-sm-6 col-xs-12">
                <div class="card corner-radius">
                    <div class="header" style="border-bottom:none;">
                        <h2>Init System Sequence</h2>
                    </div>
                    <div class="body" style="padding-top:0px">
                        <div class="clearfix">
                            <div class="form-group col-sm-12">
                                <div class="form-line">
                                    <div class="font-12">Organization</div>
                                    <select class="orgOptions form-control show-tick" id="initSeqOrgId">
                                    </select>
                                </div>
                            </div>

                            <div class="col-sm-12">
                                <button id="btnInitSequence" class="button button-rounded waves-effect waves-float pull-right" type="submit">SUBMIT</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-3 col-md-3 col-sm-6 col-xs-12">
                <div class="card corner-radius">
                    <div class="header" style="border-bottom:none;">
                        <h2>Trigger Migrate Member</h2>
                    </div>
                    <div class="body" style="padding-top:0px">
                        <div class="clearfix">
                            <div class="form-group col-sm-12">
                                <div class="form-line">
                                    <div class="font-12">Organization</div>
                                    <select class="orgOptions form-control show-tick" id="migrateMemberOrgId">
                                    </select>
                                </div>
                                <div class="form-line">
                                    <div class="font-12">Date</div>
                                    <input type="text" class="form-control" id="formDate" placeholder="Date">
                                </div>
                            </div>

                            <div class="col-sm-12">
                                <button id="btnMigrateMember" class="button button-rounded waves-effect waves-float pull-right" type="submit">SUBMIT</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script type="text/javascript">
    var EzConfigApiUrl = {
        GET_ORGANIZATIONS: 'api/organizations.json',
        GET_REFRESH_ALL_CACHES: 'api/refreshAllCaches.json',
        GET_REFRESH_ALL_DIRECTORIES: 'api/refreshAllDirectories.json',
        GET_REFRESH_ALL_MENUS: 'api/refreshAllMenus.json',

        INIT_SYSTEM_SEQUENCE: 'api/orgInitSystemSequence.json',
        INIT_MIGRATE_MEMBER: 'api/orgInitMigrateMember.json'
    };

    var EzSystemConfigService = {
        start: function() {
            $('#btnInitSequence').click(function(){
                EzWebAppClient.callApiService(EzConfigApiUrl.INIT_SYSTEM_SEQUENCE, {
                    orgId: $('#initSeqOrgId').val()
                });
            });
            $('#btnMigrateMember').click(function(){
                EzWebAppClient.callApiService(EzConfigApiUrl.INIT_MIGRATE_MEMBER, {
                    orgId: $('#migrateMemberOrgId').val(),
                    date: $('#formDate').val()
                });
            });
            EzWebAppClient.callApiService(EzConfigApiUrl.GET_ORGANIZATIONS, {});
        },
        refreshAllCaches: function() {
            EzWebAppClient.callApiService(EzConfigApiUrl.GET_REFRESH_ALL_CACHES, {});
        },
        refreshAllDirectories: function() {
            EzWebAppClient.callApiService(EzConfigApiUrl.GET_REFRESH_ALL_DIRECTORIES, {});
        },
        refreshAllMenus: function() {
            EzWebAppClient.callApiService(EzConfigApiUrl.GET_REFRESH_ALL_MENUS, {});
        },
        handleApiBizResult: function(url, response) {
            if (url === EzConfigApiUrl.GET_ORGANIZATIONS) {
                EzSystemConfigService.data.organizations = response.data;
                EzSystemConfigService.renderOrgOptions();
            }
            if (url === EzConfigApiUrl.GET_REFRESH_ALL_CACHES) {
                var message = 'Refreshed caches:<br><ul>';
                for (var i=0; i<response.data.length; i++) {
                    message += '<li>' + response.data[i] + '</li>';
                }
                message += '</ul>';
                EzWebAppViewHelper.showModalAlert(
                    'Operation Success',
                    message,
                    function(){}
                );
            }
            if (url === EzConfigApiUrl.INIT_SYSTEM_SEQUENCE || url === EzConfigApiUrl.MIGRATE_MEMBER) {
                alert(response.data);
            }
            if (url === EzConfigApiUrl.GET_REFRESH_ALL_DIRECTORIES) {
                alert(response.data);
            }
            if (url === EzConfigApiUrl.GET_REFRESH_ALL_MENUS) {
                alert(response.data);
            }
        },
        renderOrgOptions: function() {
            let orgs = EzSystemConfigService.data.organizations;
            for(var i=0; i<orgs.length; i++) {
                $('.orgOptions').append('<option value="'+ orgs[i].orgId +'">['+ orgs[i].orgId +'] '+ orgs[i].orgName +'</option>');
            }
        },
        data: {
            organizations: []
        }
    };

    $(document).ready(function(){
        EzWebAppClient.onApiBizSuccess(function(url, response){
            EzSystemConfigService.handleApiBizResult(url, response);
        });
        EzWebAppClient.onApiBizFailed(function(url, message){
            EzWebAppViewHelper.showModalAlert(
                'API Biz Failed',
                message,
                function(){}
            );
        });
        EzWebAppClient.onApiCallError(function(xhr){
            EzWebAppViewHelper.showModalAlert(
                'Application Error',
                xhr.responseText,
                function(){}
            );
        });
        EzWebAppClient.onReady(function(){
            EzSystemConfigService.start();
        });
        EzWebAppClient.start();
    });
</script>
