<section class="content">
    <ol class="breadcrumb breadcrumb-offset">
        <li><a href="home.htm">Dashboard</a></li>
        <li class="active">Manage Documents</a></li>
    </ol>

    <div class="container-fluid">
        <div class="row clearfix">
            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="card corner-radius">
                    <div class="header">
                        <h2>MANAGE DOCUMENTS</h2>
                        <div class="header-dropdown m-r--5">
                            <a href="javascript:void(0)">
                                <button id="form-add-new-btn" type="button" class="button button-rounded btn-offset waves-effect waves-float">UPLOAD</button>
                            </a>
                        </div>
                    </div>

                    <div style="margin-top: -10px;" class="body table-responsive">
                        <table class="table table-hover table-striped">
                            <thead>
                            <tr>
                                <th width="5%">File Type</th>
                                <th width="80%">File Information</th>
                                <th width="10%" class="text-center">Status</th>
                            </tr>
                            </thead>
                            <tbody id="rowsContainer"></tbody>
                        </table>
                        <ul class="pager"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="modal-form-new" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="largeModalLabel">Upload New Document</h4>
            </div>
            <div class="modal-body">
                <div class="row clearfix">
                    <div class="form-group form-float col-sm-12">
                        <div class="form-line">
                            <div class="font-12">Document Title</div>
                            <input type="text" class="form-control" id="docTitle" placeholder="Document Title" required>
                        </div>
                    </div>
                    <div class="col-sm-6" style="margin-bottom: 0px;">
                        <div class="form-group">
                            <div class="font-12 ex1">Image/PDF ( JPG, JPEG, PNG, PDF )</div>
                            <form id="newDocsForm" enctype="multipart/form-data" method="post">
                                <input type="file" accept="image/jpg,image/jpeg,image/gif,image/png,application/pdf" name="imageFile" data-max-file-size="3M" data-allowed-file-extensions="jpg jpeg png pdf" required/>
                            </form>
                            <!--img id="imagePreview" style="max-width:100%"-->
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <button id="newDocsSubmitButton" class="button button-rounded waves-effect waves-float pull-right" type="submit" name="submit">SUBMIT</button>
                        <button id="newDocsCancelButton" class="button button-rounded button-light waves-effect waves-float pull-right" type="submit" name="submit">CANCEL</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    var EzAdminUrl = {
        APP_DOCS_GET: 'api/getAppDocuments.json',
        ADMIN_COMMON_POST: 'api/adminCommonPost.json'
    };
    var EzDashboardBizService = {
        start: function() {
            EzDashboardBizService.fetchData();
        },
        fetchData: function() {
            EzWebAppClient.callApiService(EzAdminUrl.APP_DOCS_GET, {
                sessionId: EzWebAppClient.getSessionId(),
                pageNumber: EzDashboardBizService.data.pageNumber,
                pageSize: EzDashboardBizService.data.pageSize
            });
        },
        handleApiBizResult: function(url, response) {
            if (url === EzAdminUrl.APP_DOCS_GET) {
                EzDashboardBizService.reloadPageResultView(response);
            }
            if (url === EzAdminUrl.ADMIN_COMMON_POST) {
                alert(response.data);
            }
        },
        handleApiBizFailed: function(url, message) {
            if (url === EzAdminUrl.ADMIN_COMMON_POST) {
                alert(message);
            }
        },
        reloadPageResultView: function(response) {
            $('#rowsContainer').html('');
            for(let i=0; i<response.pageResult.data.length; i++) {
                let rowData = response.pageResult.data[i];
                let fileInfo = '<b>Title: '+ rowData.title +'</b><br>Created Time: '+ rowData.createdTime +'<br>'+ rowData.docUrl;
                let itemRow = $.parseHTML(DashTemplate);
                $(itemRow).find('.rowType').html(rowData.type);
                $(itemRow).find('.rowInfo').html(fileInfo);
                $(itemRow).find('.rowStatus').html(rowData.status);
                $('#rowsContainer').append(itemRow);
            }
            $('.pager').html(EzWebAppClient.renderPager(response.pageResult));
        },
        submitDocument: function() {
            let postData = {
                scene: 'ADMIN_DOCS_GALLERY',
                extendInfo: {
                    TITLE: $('#docTitle').val()
                }
            };
            EzWebAppClient.postMultipartForm('newDocsForm', postData, EzAdminUrl.ADMIN_COMMON_POST, '');
        },
        showFormNewImage: function() {
            $('#modal-form-new').removeClass('fade');
            $('#modal-form-new').addClass('show');
        },
        hideFormNewImage: function() {
            $('#modal-form-new').removeClass('show');
            $('#modal-form-new').addClass('fade');
        },
        prev: function() {
            EzDashboardBizService.data.pageNumber--;
            EzDashboardBizService.fetchNews();
        },
        next: function() {
            EzDashboardBizService.data.pageNumber++;
            EzDashboardBizService.fetchNews();
        },
        data: {
            pageNumber: 1,
            pageSize: 5,
            result: null
        }
    };

    $(document).ready(function(){
        EzWebAppClient.onApiBizSuccess(function(url, response){
            EzDashboardBizService.handleApiBizResult(url, response);
        });
        EzWebAppClient.onApiBizFailed(function(url, message){
            EzDashboardBizService.handleApiBizFailed(url, message);
        });
        EzWebAppClient.onApiCallError(function(xhr){
            console.log(xhr);
        });
        EzWebAppClient.onReady(function(){
            EzDashboardBizService.start();
        });
        EzWebAppClient.onPrev(function(){
            EzDashboardBizService.prev();
        });
        EzWebAppClient.onNext(function(){
            EzDashboardBizService.next();
        });
        EzWebAppClient.start();

        $('#form-add-new-btn').click(function(){
            EzDashboardBizService.showFormNewImage();
        });
        $('#newDocsCancelButton').click(function(){
            EzDashboardBizService.hideFormNewImage();
        });
        $('#newDocsSubmitButton').click(function(){
            EzDashboardBizService.submitDocument();
        });
    });

    var DashTemplate = ''+
        '<tr>'+
            '<td class="rowType" style="vertical-align: middle;"></td>'+
            '<td class="rowInfo" style="vertical-align: middle;"></td>'+
            '<td class="rowStatus" style="vertical-align: middle;"></td>'+
        '</tr>';

</script>
