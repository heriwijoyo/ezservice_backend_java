<script type="text/javascript">
    var EzAdminUrl = {
        GET_MEMBER_DETAIL: 'api/memberDetail.json',
        MEMBER_UPDATE_ROLES: 'api/memberUpdateRoles.json'
    };
    var EzDashboardBizService = {
        start: function() {
            EzDashboardBizService.fetchData();
        },
        fetchData: function() {
            let memberId = EzWebAppClient.getUrlParameter('id');
            if (EzWebAppClient.isBlank(memberId)) {
                EzDashboardBizService.alertInvalidMemberId();
            } else {
                EzWebAppClient.callApiService(EzAdminUrl.GET_MEMBER_DETAIL, {
                    memberId : memberId
                });
            }
        },
        submitUpdateRoles: function() {
            EzDashboardBizService.showLoader();
            let memberId = EzWebAppClient.getUrlParameter('id');
            EzWebAppClient.callApiService(EzAdminUrl.MEMBER_UPDATE_ROLES, {
                memberId : memberId,
                roles : EzDashboardBizService.fetchRoles()
            });
        },
        handleApiBizResult: function(url, response) {
            if (url === EzAdminUrl.GET_MEMBER_DETAIL) {
                EzDashboardBizService.parseData(response.data);
            }
            if (url === EzAdminUrl.MEMBER_UPDATE_ROLES) {
                alert(response.data);
                EzDashboardBizService.hideLoader();
                window.location.reload();
            }
        },
        handleApiBizFailed: function(url, message) {
            if (url === EzAdminUrl.GET_MEMBER_DETAIL) {
                alert(message);
                EzDashboardBizService.hideLoader();
                window.location.replace('members.htm');
            }
            if (url === EzAdminUrl.MEMBER_UPDATE_ROLES) {
                alert(message);
                EzDashboardBizService.hideLoader();
            }
        },
        alertInvalidMemberId: function() {
            alert('Invalid Member ID');
            window.location.replace('members.htm');
        },
        parseData: function(data) {
            $('#subOrgName').val(data.subOrgName);
            $('#roles').val(data.roles);
            $('#name').val(data.memberName);
            $('#gender').val(data.gender);
            $('#dateOfBirth').val(data.dateOfBirth);
            $('#phone').val(data.phone);
            $('#idCardNumber').val(data.idCardNumber);
            $('#education').val(data.education);
            $('#occupation').val(data.occupation);
            $('#religion').val(data.religion);
            $('#ethnic').val(data.ethnic);
            $('#districtName').val(data.districtName);
            $('#villageName').val(data.villageName);
            $('#rukunWarga').val(data.rukunWarga);
            $('#rukunTetangga').val(data.rukunTetangga);
            $('#tpsNumber').val(data.tpsNumber);

            EzDashboardBizService.parseRoles(data.roles);
        },
        fetchRoles: function() {
            var roles = [];
            $('.roles input:checked').each(function(){
                roles.push(this.value);
            });
            return roles.join(',');
        },
        parseRoles: function(data) {
            let roles = data.split(',');
            $('.roles input').each(function(){
                if (roles.includes(this.value)) {
                    $(this).prop('checked', true);
                }
            });
        },
        showLoader: function() {
            $('#btnLoader').show();
            $('#btnSubmit').hide();
        },
        hideLoader: function() {
            $('#btnLoader').hide();
            $('#btnSubmit').show();
        }
    };

    $(document).ready(function(){
        EzWebAppClient.onApiBizSuccess(function(url, response){
            EzDashboardBizService.handleApiBizResult(url, response);
        });
        EzWebAppClient.onApiBizFailed(function(url, message){
            console.log(url +' --- '+ message);
            EzDashboardBizService.handleApiBizFailed(url, message);
        });
        EzWebAppClient.onApiCallError(function(xhr){
            console.log(xhr);
        });
        EzWebAppClient.onReady(function(){
            EzDashboardBizService.start();
        });
        EzWebAppClient.onPrev(function(){
            EzDashboardBizService.prev();
        });
        EzWebAppClient.onNext(function(){
            EzDashboardBizService.next();
        });
        EzWebAppClient.start();

        $('#districtId').change(function(){
            EzDashboardBizService.fetchCoreArea('VILLAGE', $('#districtId').val());
        });
        $('#btnSubmit').click(function(){
            EzDashboardBizService.submitMember();
        });
        $('#btnUpdateRoles').click(function(){
            EzWebAppViewHelper.showAppModal('modal-form');
        });
        $('#cancelButton').click(function(){
            EzWebAppViewHelper.hideAppModal('modal-form');
        });
        $('#submitButton').click(function(){
            EzDashboardBizService.submitUpdateRoles();
        });

    });

</script>
