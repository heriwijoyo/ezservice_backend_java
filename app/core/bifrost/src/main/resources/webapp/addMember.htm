<section class="content">
    <ol class="breadcrumb">
        <li><a href="home.htm">Dashboard</a></li>
        <li><a href="organization.htm">Manage Organization</a></li>
        <li class="active">Add Member</li>
    </ol>

    <div class="container-fluid">
        <div class="row clearfix">
            <div class="col-lg-8 col-md-8 col-sm-12 col-xs-12">
                <div class="card corner-radius">
                    <div class="header">
                        <h2>ADD MEMBER</h2>
                    </div>
                    <div class="body">
                        <div class="row clearfix">

                            <div class="form-group col-sm-12">
                                <div class="form-line">
                                    <div class="font-12">Organization Status</div>
                                    <select class="form-control show-tick" id="orgStatus">
                                        <option value="0">NOT ACTIVE</option>
                                        <option value="1">ACTIVE</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group col-sm-12">
                                <div class="form-line">
                                    <div class="font-12">Created Time</div>
                                    <input type="text" class="form-control" id="createdTime" placeholder="Created Time" disabled>
                                </div>
                            </div>

                            <div class="form-group col-sm-12">
                                <div class="form-line">
                                    <div class="font-12">Last Modified Time</div>
                                    <input type="text" class="form-control" id="modifiedTime" placeholder="Last Modified Time" disabled>
                                </div>
                            </div>

                            <div class="col-sm-12">
                                <img id="orgUpdateLoader" src="assets/img/loading.gif" style="height:40px;display:none" class="pull-right">
                                <button id="orgIconUpdateBtn" class="button button-rounded waves-effect waves-float pull-right" type="submit">SUBMIT</button>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</section>

<script type="text/javascript">
    var EzAdminUrl = {
        GET_ORGANIZATION_DETAIL: 'api/getOrganizationDetail.json',
        ORGANIZATION_UPDATE: 'api/organizationUpdate.json',
        APP_CLIENT_CONFIG_UPDATE: 'api/appClientConfigUpdate.json',
        APP_CONFIG_UPDATE: 'api/appConfigUpdate.json',
        CORE_ORG_CONFIG_UPDATE: 'api/coreOrgConfigUpdate.json',
        WHATSAPP_SEND_MESSAGE: 'api/whatsappSend.json',
        ORG_ADMIN_ADD: 'api/coreOrgAdminAdd.json',
        ADMIN_COMMON_POST: 'api/adminCommonPost.json'
    };
    var EzDashboardBizService = {
        start: function() {
            EzDashboardBizService.fetchOrganization();
        },
        fetchOrganization: function() {
            let orgId = EzWebAppClient.getUrlParameter('id');
            if (EzWebAppClient.isBlank(orgId)) {
                EzDashboardBizService.alertInvalidOrg();
            } else {
                 EzWebAppClient.callApiService(EzAdminUrl.GET_ORGANIZATION_DETAIL, {
                    orgId: orgId
                 });
            }
        },
        updateOrganization: function() {
            EzWebAppClient.callApiService(EzAdminUrl.ORGANIZATION_UPDATE, {
                orgId: EzWebAppClient.getUrlParameter('id'),
                extendConfig: $('#extendConfig').val(),
                address: $('#address').val(),
                contactName: $('#contactName').val(),
                contactPhone: $('#contactPhone').val(),
                contactEmail: $('#contactEmail').val(),
                status: $('#orgStatus').val()
            });
        },
        storeAppConfig: function() {
            let orgId = EzWebAppClient.getUrlParameter('id');
            if (EzWebAppClient.isNotBlank(orgId)) {
                EzWebAppClient.callApiService(EzAdminUrl.APP_CLIENT_CONFIG_UPDATE, {
                    orgId: orgId,
                    id: $('#configId').val(),
                    appId: $('#appId').val(),
                    clientId: $('#clientId').val(),
                    clientSecret: $('#clientSecret').val(),
                    createdTime: $('#clientCreatedTime').val(),
                    status: $('#clientStatus').val()
                });
            }
        },
        storeBizAppConfig: function() {
            var mapData = [];
            $('.appConfigItem').each(function(i, obj){
                let key = $(obj).find('.appConfigKey').html();
                let val = $(obj).find('.appConfigValue input').val();
                let stat = $(obj).find('.appConfigStatus input').val();
                mapData.push({
                    configKey: key,
                    configValue: val,
                    status: stat
                });
            });
            let orgId = EzWebAppClient.getUrlParameter('id');
            if (EzWebAppClient.isNotBlank(orgId)) {
                EzWebAppClient.callApiService(EzAdminUrl.APP_CONFIG_UPDATE, {
                    orgId: orgId,
                    mapData: JSON.stringify(mapData)
                });
            }
        },
        storeCoreOrgConfig: function() {
            $('.coreOrgConfigBtnSubmit').hide();
            $('.coreOrgConfigImgLoader').show();
            let orgId = EzWebAppClient.getUrlParameter('id');
            if (EzWebAppClient.isNotBlank(orgId)) {
                var mapData = {};
                $('.coreConfigItem').each(function(i, obj){
                    let key = $(obj).find('.coreConfigKey').html();
                    let val = $(obj).find('.coreConfigValue').val();
                    mapData[key] = val;
                });
                EzWebAppClient.callApiService(EzAdminUrl.CORE_ORG_CONFIG_UPDATE, {
                    orgId: orgId,
                    mapData: JSON.stringify(mapData)
                });
            }
        },
        waSendMessage: function() {
            EzWebAppClient.callApiService(EzAdminUrl.WHATSAPP_SEND_MESSAGE, {
                orgId: EzWebAppClient.getUrlParameter('id'),
                phone: $('#waSendPhone').val(),
                message: $('#waSendMessage').val()
            });
        },
        addOrgAdmin: function() {
            let orgId = EzWebAppClient.getUrlParameter('id');
            if (EzWebAppClient.isNotBlank(orgId)) {
                EzWebAppClient.callApiService(EzAdminUrl.ORG_ADMIN_ADD, {
                    orgId: orgId,
                    name: $('#newMemberName').val(),
                    phone: $('#newMemberPhone').val(),
                    email: $('#newMemberEmail').val()
                });
            }
        },
        postNewIcon: function() {
            let orgId = EzWebAppClient.getUrlParameter('id');
            let postData = {
                scene: 'ADMIN_APP_ICON',
                extendInfo: {
                    ORG_ID: orgId
                }
            };
            EzWebAppClient.postMultipartForm('newIconForm', postData, EzAdminUrl.ADMIN_COMMON_POST, '');
        },
        postNewBuildPackage: function() {
            $('#newBuildSubmitButton').hide();
            $('#newBuildCancelButton').hide();
            $('#newBuildLoader').show();
            let orgId = EzWebAppClient.getUrlParameter('id');
            let postData = {
                scene: 'ADMIN_APP_BUILD_PACKAGE',
                extendInfo: {
                    ORG_ID: orgId,
                    PLATFORM: 'ANDROID',
                    VERSION_CODE: $('#buildVersionCode').val(),
                    VERSION_NAME: $('#buildVersionName').val()
                }
            };
            EzWebAppClient.postMultipartForm('newBuildPackageForm', postData, EzAdminUrl.ADMIN_COMMON_POST, 'NEW_BUILD');
        },
        handleApiBizResult: function(url, response) {
            if (url === EzAdminUrl.GET_ORGANIZATION_DETAIL) {
                EzDashboardBizService.renderOrganizationCard(response.data.bizOrganization);
                EzDashboardBizService.renderAppClientConfigCard(response.data.bizApplicationConfig);
                EzDashboardBizService.renderCoreConfigCard(response.data.coreOrgConfigMap);
                EzDashboardBizService.renderBizAppConfigCard(response.data.bizAppConfigs);
                EzDashboardBizService.renderAdminMemberCard(response.data.adminMembers);
                EzDashboardBizService.renderAdminBuildCard(response.data.bizAppBuildPackages, response.data.bizOrganization.code);
            }
            if (url === EzAdminUrl.ORGANIZATION_UPDATE) {
                alert(response.data);
                $('#orgUpdateLoader').hide();
                $('#orgUpdateBtn').show();
                EzDashboardBizService.fetchOrganization();
            }
            if (url === EzAdminUrl.APP_CLIENT_CONFIG_UPDATE) {
                alert(response.data);
                $('#clientLoader').hide();
                $('#clientUpdateBtn').show();
                EzDashboardBizService.fetchOrganization();
            }
            if (url === EzAdminUrl.APP_CONFIG_UPDATE) {
                alert(response.data);
                EzDashboardBizService.fetchOrganization();
            }
            if (url === EzAdminUrl.CORE_ORG_CONFIG_UPDATE) {
                alert(response.data);
                EzDashboardBizService.fetchOrganization();
            }
            if (url === EzAdminUrl.WHATSAPP_SEND_MESSAGE) {
                alert(response.data);
                $('#waSendPhone').val('');
                $('#waSendMessage').val('');
            }
            if (url === EzAdminUrl.ORG_ADMIN_ADD) {
                alert(response.data);
                window.location.reload();
            }
            if (url === EzAdminUrl.ADMIN_COMMON_POST) {
                alert(response.data);
                window.location.reload();
            }
            if (url === (EzAdminUrl.ADMIN_COMMON_POST + 'NEW_BUILD')) {
                alert(response.data);
                window.location.reload();
            }
        },
        handleApiBizFailed: function(url, message) {
            if (url === EzAdminUrl.GET_ORGANIZATION_DETAIL) {
                EzDashboardBizService.alertInvalidOrg();
            }
            if (url === EzAdminUrl.ORGANIZATION_UPDATE) {
                alert(message);
                $('#orgUpdateLoader').hide();
                $('#orgUpdateBtn').show();
            }
            if (url === EzAdminUrl.APP_CLIENT_CONFIG_UPDATE) {
                alert(message);
                $('#clientLoader').hide();
                $('#clientUpdateBtn').show();
                let configId = $('#configId').val();
                if (EzWebAppClient.isBlank(configId)) {
                    $('#clientGenerateBtn').show();
                }
            }
            if (url === EzAdminUrl.APP_CONFIG_UPDATE ||
                url === EzAdminUrl.ORG_ADMIN_ADD ||
                url === EzAdminUrl.ADMIN_COMMON_POST ||
                url === EzAdminUrl.WHATSAPP_SEND_MESSAGE) {
                alert(message);
            }
            if (url === EzAdminUrl.CORE_ORG_CONFIG_UPDATE) {
                alert(message);
                $('.coreOrgConfigImgLoader').hide();
                $('.coreOrgConfigBtnSubmit').show();
            }
            if (url === (EzAdminUrl.ADMIN_COMMON_POST + 'NEW_BUILD')) {
                alert(message);
                $('#newBuildSubmitButton').show();
                $('#newBuildCancelButton').show();
                $('#newBuildLoader').hide();
            }
        },
        renderOrganizationCard: function(data) {
            $('#orgIconImg').attr('src', '../app/'+ data.code +'/icon.png?'+ Math.random());
            $('#orgName').val(data.name);
            $('#orgId').val(data.orgId);
            $('#nativeOrgId').html(EzDashboardBizService.generateNativeCode(data.orgId));
            $('#orgCode').val(data.code);
            $('#extendConfig').val(data.extendConfig);
            $('#createdTime').val(data.createdTime);
            $('#modifiedTime').val(data.modifiedTime);
            $('#address').val(data.address);
            $('#contactName').val(data.contactName);
            $('#contactPhone').val(data.contactPhone);
            $('#contactEmail').val(data.contactEmail);

            if (data.status == 1) {
                $('#orgStatus option[value="1"]').prop('selected', true);
            } else {
                $('#orgStatus option[value="0"]').prop('selected', true);
            }
        },
        renderAppClientConfigCard: function(data) {
            if (data.id == null) {
                $('#clientGenerateBtn').show();
                $('#clientGenerateBtn').click(function(){
                    EzDashboardBizService.generateAppConfig();
                });
            } else {
                $('#configId').val(data.id);
                $('#appId').val(data.appId);
                $('#nativeAppId').html(EzDashboardBizService.generateNativeCode(data.appId));
                $('#clientId').val(data.clientId);
                $('#nativeClientId').html(EzDashboardBizService.generateNativeCode(data.clientId));
                $('#clientSecret').val(data.clientSecret);
                $('#nativeClientSecret').html(EzDashboardBizService.generateNativeCode(data.clientSecret));
                $('#clientCreatedTime').val(data.createdTime);
                $('#clientModifiedTime').val(data.modifiedTime);
                if (data.status == 1) {
                    $('#clientStatus option[value="1"]').prop('selected', true);
                } else {
                    $('#clientStatus option[value="0"]').prop('selected', true);
                }
            }
        },
        renderBizAppConfigCard: function(data) {
            $('#bizAppConfigContainer').html('');
            for(i = 0; i<data.length; i++) {
                let rowItem = $.parseHTML(EzBizAppConfigTemplate);
                $(rowItem).find('.appConfigKey').html(data[i].configKey);
                $(rowItem).find('.appConfigValue input').val(data[i].configValue);
                $(rowItem).find('.appConfigStatus input').val(data[i].status);
                $('#bizAppConfigContainer').append(rowItem);
            }
        },
        renderCoreConfigCard: function(data) {
            $('#coreOrgConfigContainer').html('');
            for (const [key, value] of Object.entries(data)) {
                let itemRow = $.parseHTML(EzCoreOrgConfigTemplate);
                $(itemRow).find('.coreConfigKey').html(key);
                $(itemRow).find('.coreConfigValue').val(value);
                $('#coreOrgConfigContainer').append(itemRow);
            }
            let btnSection = $.parseHTML(EzCoreOrgConfigBtnTemplate);
            $(btnSection).find('.coreOrgConfigBtnSubmit').click(function(){
                EzDashboardBizService.storeCoreOrgConfig();
            });
            $('#coreOrgConfigContainer').append(btnSection);
        },
        renderAdminMemberCard: function(data) {
            $('#orgAdminContainer').html('');
            for(i=0; i<data.length; i++) {
                let rowItem = $.parseHTML(EzAdminMemberTemplate);
                $(rowItem).find('.coreMemberId').html(data[i].memberId);
                $(rowItem).find('.coreMemberName').html(data[i].name);
                $(rowItem).find('.coreMemberPhone').html(data[i].phone);
                $(rowItem).find('.coreMemberEmail').html(data[i].email);
                $(rowItem).find('.coreMemberRoles').html(data[i].roles);
                $('#orgAdminContainer').append(rowItem);
            }
        },
        renderAdminBuildCard: function(data, orgCode) {
            $('#buildPackageContainer').html('');
            for(i=0; i<data.length; i++) {
                let versionName = data[i].versionName;
                let rowItem = $.parseHTML(EzAdminBuildTemplate);
                $(rowItem).find('.buildPlatform').html(data[i].platform);
                $(rowItem).find('.buildVersionCode').html(data[i].versionCode);
                $(rowItem).find('.buildVersionName').html('<a href="../app/'+ orgCode +'/download/apk/'+ versionName +'" target="_blank">'+ versionName +'</a>');
                $(rowItem).find('.buildCreatedTime').html(data[i].createdTime);
                $(rowItem).find('.buildStatus').html(data[i].status);
                $('#buildPackageContainer').append(rowItem);
            }
        },
        generateAppConfig: function() {
            let appId = EzDashboardBizService.randomText('Native.Android.');
            let clientId = EzDashboardBizService.randomText('');
            let clientSecret = EzDashboardBizService.randomText('');
            $('#appId').val(appId);
            $('#clientId').val(clientId);
            $('#clientSecret').val(clientSecret);
        },
        showNewIconForm: function() {
            $('#modal-new-icon').removeClass('fade');
            $('#modal-new-icon').addClass('show');
        },
        showNewAdminForm: function() {
            $('#modal-new-admin').removeClass('fade');
            $('#modal-new-admin').addClass('show');
        },
        showNewBuildForm: function() {
            $('#modal-new-build').removeClass('fade');
            $('#modal-new-build').addClass('show');
        },
        hideNewIconForm: function() {
            $('#modal-new-icon').removeClass('show');
            $('#modal-new-icon').addClass('fade');
        },
        hideNewAdminForm: function() {
            $('#modal-new-admin').removeClass('show');
            $('#modal-new-admin').addClass('fade');
        },
        hideNewBuildForm: function() {
            $('#modal-new-build').removeClass('show');
            $('#modal-new-build').addClass('fade');
        },
        randomText: function(prefix) {
            let length = 32 - prefix.length;
            let result = '';
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const charactersLength = characters.length;
            let counter = 0;
            while (counter < length) {
              result += characters.charAt(Math.floor(Math.random() * charactersLength));
              counter += 1;
            }
            return prefix + result;
        },
        generateNativeCode: function(str) {
            if (EzWebAppClient.isBlank(str)) {
                return '';
            }
            var nativeCode = '';
            for (i=0; i<str.length; i++) {
                let char = str.charAt(i);
                let indexOf = EzBizNativeAllChars.indexOf(char);
                nativeCode += indexOf;
                if (i < str.length -1) {
                    nativeCode += ',';
                }
            }
            return nativeCode;
        },
        alertInvalidOrg: function() {
            alert('Invalid Organization');
            window.location.replace('organization.htm');
        }
    };

    $(document).ready(function(){
        EzWebAppClient.onApiBizSuccess(function(url, response){
            EzDashboardBizService.handleApiBizResult(url, response);
        });
        EzWebAppClient.onApiBizFailed(function(url, message){
            console.log(url +' --- '+ message);
            EzDashboardBizService.handleApiBizFailed(url, message);
        });
        EzWebAppClient.onApiCallError(function(xhr){
            console.log(xhr);
        });
        EzWebAppClient.onReady(function(){
            EzDashboardBizService.start();
        });
        EzWebAppClient.onPrev(function(){
            EzDashboardBizService.prev();
        });
        EzWebAppClient.onNext(function(){
            EzDashboardBizService.next();
        });
        EzWebAppClient.start();

        $('#orgUpdateBtn').click(function(){
            $('#orgUpdateBtn').hide();
            $('#orgUpdateLoader').show();
            EzDashboardBizService.updateOrganization();
        });
        $('#orgIconUpdateBtn').click(function(){
            EzDashboardBizService.showNewIconForm();
        });
        $('#newIconCancelButton').click(function(){
            EzDashboardBizService.hideNewIconForm();
        });
        $('#newIconSubmitButton').click(function(){
            EzDashboardBizService.postNewIcon();
        });
        $('#clientUpdateBtn').click(function(){
            $('#clientUpdateBtn').hide();
            $('#clientGenerateBtn').hide();
            $('#clientLoader').show();
            EzDashboardBizService.storeAppConfig();
        });
        $('#appConfigBtnSubmit').click(function(){
            EzDashboardBizService.storeBizAppConfig();
        });
        $('#addAdminBtnSubmit').click(function(){
            EzDashboardBizService.showNewAdminForm();
        });
        $('#newAdminCancelButton').click(function(){
            EzDashboardBizService.hideNewAdminForm();
        });
        $('#newAdminSubmitButton').click(function(){
            EzDashboardBizService.addOrgAdmin();
        });
        $('#buildPackageBtnSubmit').click(function(){
            EzDashboardBizService.showNewBuildForm();
        });
        $('#newBuildCancelButton').click(function(){
            EzDashboardBizService.hideNewBuildForm();
        });
        $('#newBuildSubmitButton').click(function(){
            EzDashboardBizService.postNewBuildPackage();
        });
        $('#waSendBtnSubmit').click(function(){
            EzDashboardBizService.waSendMessage();
        });
        $('#nativeCodeBtn').click(function(){
            let plainCode = $('#plainCode').val();
            let nativeCode = EzDashboardBizService.generateNativeCode(plainCode);
            $('#nativeCode').val(nativeCode);
        });
    });

    var EzBizNativeAllChars = 'AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz0123456789.:/';

    var EzBizAppConfigTemplate = ''+
        '<tr class="appConfigItem">'+
            '<td class="appConfigKey" style="vertical-align: middle;"></td>'+
            '<td class="appConfigValue" style="vertical-align: middle;">'+
                '<input type="text"/>'+
            '</td>'+
            '<td class="appConfigStatus" style="vertical-align: middle;">'+
                '<input type="text"/>'+
            '</td>'+
        '</tr>';

    var EzCoreOrgConfigTemplate = ''+
        '<div class="form-group col-sm-12">'+
            '<div class="form-line coreConfigItem">'+
                '<div class="font-12 coreConfigKey"></div>'+
                '<input type="text" class="form-control coreConfigValue">'+
            '</div>'+
        '</div>';

    var EzCoreOrgConfigBtnTemplate = ''+
        '<div class="col-sm-12">'+
            '<img src="assets/img/loading.gif" style="height:40px;display:none" class="pull-right coreOrgConfigImgLoader">'+
            '<button class="button button-rounded waves-effect waves-float pull-right coreOrgConfigBtnSubmit">UPDATE</button>'+
        '</div>';

    var EzAdminMemberTemplate = ''+
        '<tr class="">'+
            '<td class="coreMemberId" style="vertical-align: middle;"></td>'+
            '<td class="coreMemberName" style="vertical-align: middle;"></td>'+
            '<td class="coreMemberPhone" style="vertical-align: middle;"></td>'+
            '<td class="coreMemberEmail" style="vertical-align: middle;"></td>'+
            '<td class="coreMemberRoles" style="vertical-align: middle;"></td>'+
        '</tr>';

    var EzAdminBuildTemplate = ''+
        '<tr class="">'+
            '<td class="buildPlatform" style="vertical-align: middle;"></td>'+
            '<td class="buildVersionCode" style="vertical-align: middle;"></td>'+
            '<td class="buildVersionName" style="vertical-align: middle;"></td>'+
            '<td class="buildCreatedTime" style="vertical-align: middle;"></td>'+
            '<td class="buildStatus" style="vertical-align: middle;"></td>'+
        '</tr>';

</script>
</body>

</html>
