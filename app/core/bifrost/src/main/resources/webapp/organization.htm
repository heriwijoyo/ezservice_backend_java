<section class="content">
    <ol class="breadcrumb breadcrumb-offset">
        <li><a href="home.htm">Dashboard</a></li>
        <li class="active">Manage Organization</a></li>
    </ol>

    <div class="container-fluid">
        <div class="row clearfix">
            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="card corner-radius">
                    <div class="header">
                        <h2>MANAGE ORGANIZATIONS</h2>
                        <div class="header-dropdown m-r--5">
                            <a href="addOrganization.htm">
                                <button type="button" class="button button-rounded btn-offset waves-effect waves-float">ADD NEW ORGANIZATION</button>
                            </a>
                        </div>
                    </div>

                    <div style="margin-top: -10px;" class="body table-responsive">
                        <table class="table table-hover table-striped">
                            <thead>
                            <tr>
                                <th width="15%">Org Name</th>
                                <th width="10%">Org ID</th>
                                <th width="10%">Org Code</th>
                                <th width="15%">Address</th>
                                <th width="10%">Contact</th>
                                <th width="20%">Timestamp</th>
                                <th width="10%" class="text-center">Status</th>
                            </tr>
                            </thead>
                            <tbody id="rowsContainer"></tbody>
                        </table>
                        <ul class="pager"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script type="text/javascript">
    var EzAdminUrl = {
        GET_ORGANIZATIONS: 'api/getOrganization.json'
    };
    var EzDashboardBizService = {
        start: function() {
            EzDashboardBizService.fetchOrganizations();
        },
        fetchOrganizations: function() {
            EzWebAppClient.callApiService(EzAdminUrl.GET_ORGANIZATIONS, {
                sessionId: EzWebAppClient.getSessionId(),
                pageNumber: EzDashboardBizService.data.pageNumber,
                pageSize: EzDashboardBizService.data.pageSize
            });
        },
        handleApiBizResult: function(url, response) {
            if (url === EzAdminUrl.GET_ORGANIZATIONS) {
                EzDashboardBizService.data.result = response.pageResult;
                EzDashboardBizService.reloadPageResultView(response);
            }
        },
        reloadPageResultView: function(response) {
            $('#rowsContainer').html('');
            for(let i=0; i<response.pageResult.data.length; i++) {
                let rowData = response.pageResult.data[i];
                let itemRow = $.parseHTML(DashTemplate);
                $(itemRow).find('.rowName').html(rowData.name);
                $(itemRow).find('.rowId').html('<a href="organizationDetail.htm?id='+ rowData.orgId +'">'+ rowData.orgId +'</a>');
                $(itemRow).find('.rowCode').html(rowData.code);
                $(itemRow).find('.rowAddress').html(rowData.address);
                $(itemRow).find('.rowContact').html('phone: '+ rowData.contactPhone +'<br>email: '+ rowData.contactEmail);
                $(itemRow).find('.rowTime').html('created: '+ rowData.createdTime +'<br>modified: '+ rowData.modifiedTime);
                $(itemRow).find('.rowStatus').html(EzDashboardBizService.renderFlag(rowData.status,'status',rowData.id));
                $('#rowsContainer').append(itemRow);
            }
            $('.pager').html(EzWebAppClient.renderPager(response.pageResult));
        },
        renderFlag: function(flag,section,id) {
            let flagText = flag == 1 ? 'YES' : 'NO';
            let switchFlag = flag == 1 ? '0' : '1';
            return '<center>'+ flagText + '<br><button onClick="EzDashboardBizService.swithFlag(\''+id+'\',\''+section+'\',\''+switchFlag+'\')" class="button button-rounded waves-effect waves-float" type="submit">SWITCH</button></center>';
        },
        swithFlag: function(itemId,value) {
            /*
            EzWebAppClient.callApiService('', {
                sessionId: EzWebAppClient.getSessionId(),
                itemId: itemId,
                section: section,
                value: value
            }); */
        },
        showFormNewImage: function() {
            $('#modal-form-new').removeClass('fade');
            $('#modal-form-new').addClass('show');
        },
        hideFormNewImage: function() {
            $('#modal-form-new').removeClass('show');
            $('#modal-form-new').addClass('fade');
        },
        resetFormNewImage: function() {
            $('#imageTitle').val('');
            $('#imageFile').val('');
            $('#imagePreview').hide();
            $('#newImageSubmitLoader').hide();
            $('#newImageSubmitButton').show();
            $('#newImageCancelButton').show();
        },
        prev: function() {
            EzDashboardBizService.data.pageNumber--;
            EzDashboardBizService.fetchGalleries();
        },
        next: function() {
            EzDashboardBizService.data.pageNumber++;
            EzDashboardBizService.fetchGalleries();
        },
        data: {
            pageNumber: 1,
            pageSize: 10,
            result: null
        }
    };

    $(document).ready(function(){
        EzWebAppClient.onApiBizSuccess(function(url, response){
            EzDashboardBizService.handleApiBizResult(url, response);
        });
        EzWebAppClient.onApiBizFailed(function(url, message){
            console.log(url +' --- '+ message);
        });
        EzWebAppClient.onApiCallError(function(xhr){
            console.log(xhr);
        });
        EzWebAppClient.onReady(function(){
            EzDashboardBizService.start();
        });
        EzWebAppClient.onPrev(function(){
            EzDashboardBizService.prev();
        });
        EzWebAppClient.onNext(function(){
            EzDashboardBizService.next();
        });
        EzWebAppClient.start();

        $('#form-add-new-btn').click(function(){
            EzDashboardBizService.showFormNewImage();
        });
        $('#newImageCancelButton').click(function(){
            EzDashboardBizService.hideFormNewImage();
        });
        $('#newImageSubmitButton').click(function(event){
            event.preventDefault();
            $('#newImageSubmitButton').hide();
            $('#newImageCancelButton').hide();
            $('#newImageSubmitLoader').show();
            EzDashboardBizService.postNewImage();
        });
    });

    var DashTemplate = ''+
        '<tr>'+
            '<td class="rowName" style="vertical-align: middle;"></td>'+
            '<td class="rowId" style="vertical-align: middle;"></td>'+
            '<td class="rowCode" style="vertical-align: middle;"></td>'+
            '<td class="rowAddress" style="vertical-align: middle;"></td>'+
            '<td class="rowContact" style="vertical-align: middle;"></td>'+
            '<td class="rowTime" style="vertical-align: middle;"></td>'+
            '<td class="rowStatus" style="vertical-align: middle;"></td>'+
        '</tr>';

</script>
