<link rel="stylesheet" type="text/css" href="../../../../assets/css/tables/a11y-light.css"/>
<link rel="stylesheet" type="text/css" href="../../../../assets/css/tables/jspreadsheet.min.css"/>
<script type="text/javascript" src="../../../../assets/js/tables/jsuites.min.js"></script>
<script type="text/javascript" src="../../../../assets/js/tables/index.min.js"></script>
<style type="text/css">
    .jexcel>tbody>tr>td.readonly{color:rgba(0,0,0,.8)}
</style>

<section class="content">
    <ol class="breadcrumb breadcrumb-offset">
        <li class="active">Master Data Overall</li>
    </ol>

    <div class="container-fluid" id="fade-in">
        <div class="row">
            <h3>Update Master Data Overall</h3>
            <div id="masterDataOverall"></div>
        </div>
    </div>
</section>

<script type="text/javascript">
    var EzAdminUrl = {
        REPORT_OVERALL_GET: 'api/reportOverall.json',
        REPORT_OVERALL_UPDATE: 'api/reportOverallUpdate.json'
    };
    var EzAppService = {
        start: function() {
            EzWebAppClient.callApiService(EzAdminUrl.REPORT_OVERALL_GET, {});
        },
        onApiBizSuccess: function(url, response) {
            if (url === EzAdminUrl.REPORT_OVERALL_GET) {
                EzAppService.render(response.data);
            }
        },
        onChange: function(instance, cell, x, y, value) {
            var overallKey = EzAppService.jsp.getValueFromCoords(0,y);
            EzWebAppClient.callApiService(EzAdminUrl.REPORT_OVERALL_UPDATE, {
                overallKey: overallKey,
                overallValue: value
            });
        },
        render: function(data) {
            EzAppService.jsp = jspreadsheet(document.getElementById('masterDataOverall'), {
                columns: [
                    {width:300, align:'left', title:'Master Data Key', readOnly:true},
                    {width:300, align:'left', title:'Description', readOnly:true},
                    {width:100, title:'Value'}
                ],
                data: data,
                tableOverflow: false,
                contextMenu: function(obj, x, y, e) {},
                onchange: EzAppService.onChange
            });
        },
        jsp: null
    };

    $(document).ready(function(){
        EzWebAppClient.onApiBizSuccess(function(url, response){
            EzAppService.onApiBizSuccess(url, response);
        });
        EzWebAppClient.onApiBizFailed(function(url, message){
            EzWebAppViewHelper.showModalAlert(
                'API Biz Failed',
                message,
                function(){}
            );
        });
        EzWebAppClient.onApiCallError(function(xhr){
            EzWebAppViewHelper.showModalAlert(
                'Application Error',
                xhr.responseText,
                function(){}
            );
        });
        EzWebAppClient.onReady(function(){
            EzAppService.start();
        });
        EzWebAppClient.start();
    });
</script>
