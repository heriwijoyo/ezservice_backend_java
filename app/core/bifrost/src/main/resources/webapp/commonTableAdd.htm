INCLUDE_SMART_FORM_CLIENT
<script type="text/javascript">
    var EzAdminUrl = {
        GET_MEMBER_REQUIRED_DATA: 'api/memberAddRequiredData.json',
        GET_CORE_AREA: 'api/adminCoreArea.json',
        REGISTER_MEMBER: 'api/memberAdd.json'
    };
    var EzDashboardBizService = {
        start: function() {
            EzSmartFormClientStarter.start();
            //EzDashboardBizService.fetchData();
        },
        fetchData: function() {
             EzWebAppClient.callApiService(EzAdminUrl.GET_MEMBER_REQUIRED_DATA, {});
        },
        fetchCoreArea: function(level, parentId) {
            EzWebAppClient.callApiService(EzAdminUrl.GET_CORE_AREA, {
                level : level,
                parentId : parentId
            });
        },
        submitMember: function() {
            EzDashboardBizService.showLoader();
            let orgId = EzWebAppClient.getUrlParameter('id');
            EzWebAppClient.callApiService(EzAdminUrl.REGISTER_MEMBER, {
                orgId : orgId,
                referrerId: $('#referrer_id').val(),
                subOrgId: $('#sub_org_id').val(),
                roles: EzDashboardBizService.parseRoles(),
                name: $('#name').val(),
                gender: $('#gender').val(),
                dateOfBirth: $('#dateOfBirth').val(),
                phone: $('#phone').val(),
                education: $('#education').val(),
                occupation: $('#occupation').val(),
                religion: $('#religion').val(),
                ethnic: $('#ethnic').val(),
                idCardNumber: $('#idCardNumber').val(),
                districtId: $('#districtId').val(),
                villageId: $('#villageId').val(),
                rukunWarga: $('#rukunWarga').val(),
                rukunTetangga: $('#rukunTetangga').val(),
                tpsNo: $('#tpsNo').val()
            });
        },
        handleApiBizResult: function(url, response) {
            if (url === EzAdminUrl.GET_MEMBER_REQUIRED_DATA) {
                EzDashboardBizService.parseData(response.data);
            }
            if (url === EzAdminUrl.GET_CORE_AREA) {
                EzDashboardBizService.parseVillage(response.data);
            }
            if (url === EzAdminUrl.REGISTER_MEMBER) {
                alert(response.data);
                EzDashboardBizService.hideLoader();
            }
        },
        handleApiBizFailed: function(url, message) {
            if (url === EzAdminUrl.GET_ORGANIZATION_DETAIL) {
                EzDashboardBizService.alertInvalidOrg();
            }
            if (url === EzAdminUrl.REGISTER_MEMBER) {
                alert(message);
                EzDashboardBizService.hideLoader();
                window.location.replace('members.htm');
            }
        },
        parseRoles: function() {
            var roles = [];
            $('.roles input:checked').each(function(){
                roles.push(this.value);
            });
            return roles.join(',');
        },
        parseData: function(data) {
            var memberOption = '';
            for(i = 0; i < data.adminMembers.length; i++) {
                memberOption += '<option value="'+ data.adminMembers[i].memberId +'">'+ data.adminMembers[i].name +'</option>';
            }
            $('#referrer_id').html(memberOption);
            var subOrgOption = '';
            for(i = 0; i < data.bizSubOrganizations.length; i++) {
                subOrgOption += '<option value="'+ data.bizSubOrganizations[i].subOrgId +'">'+ data.bizSubOrganizations[i].name +'</option>';
            }
            $('#sub_org_id').html(subOrgOption);
        },
        parseVillage: function(data) {
            var villageOption = '';
            for(i = 0; i < data.length; i++) {
                villageOption += '<option value="'+ data[i].id +'">'+ data[i].name +'</option>';
            }
            $('#villageId').html(villageOption);
        },
        showLoader: function() {
            $('#btnLoader').show();
            $('#btnSubmit').hide();
        },
        hideLoader: function() {
            $('#btnLoader').hide();
            $('#btnSubmit').show();
        }
    };

    $(document).ready(function(){
        EzWebAppClient.onApiBizSuccess(function(url, response){
            EzDashboardBizService.handleApiBizResult(url, response);
        });
        EzWebAppClient.onApiBizFailed(function(url, message){
            console.log(url +' --- '+ message);
            EzDashboardBizService.handleApiBizFailed(url, message);
        });
        EzWebAppClient.onApiCallError(function(xhr){
            console.log(xhr);
        });
        EzWebAppClient.onReady(function(){
            EzDashboardBizService.start();
        });
        EzWebAppClient.onPrev(function(){
            EzDashboardBizService.prev();
        });
        EzWebAppClient.onNext(function(){
            EzDashboardBizService.next();
        });
        EzWebAppClient.start();
    });

</script>
</body>

</html>
