<section class="content">
    <ol class="breadcrumb breadcrumb-offset">
        <li class="active">Upload Data</li>
    </ol>

    <div class="container-fluid" id="fade-in">
        <div id="dashboard-container" class="row"></div>
    </div>
</section>

<div class="modal fade" id="modal-import-form" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="upload-title"></h4>
            </div>
            <div class="modal-body">
                <div class="row clearfix">
                    <div class="col-sm-6" style="margin-bottom: 0px;">
                        <div class="form-group">
                            <div class="font-12 ex1">CSV File</div>
                            <form id="importForm" enctype="multipart/form-data" method="post">
                                <input type="file" id="importFile" name="importFile" data-allowed-file-extensions="csv" required/>
                            </form>
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <img id="importLoader" src="assets/img/loading.gif" style="height:40px;display:none" class="pull-right">
                        <button id="importSubmitButton" class="button button-rounded waves-effect waves-float pull-right" type="submit" name="submit">SUBMIT</button>
                        <button id="importCancelButton" class="button button-rounded button-light waves-effect waves-float pull-right" type="submit" name="submit">CANCEL</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    var EzConfigApiUrl = {
        GET_SUB_ORGANIZATIONS: 'api/subOrganizations.json',
        CSV_UPLOAD_URL: 'api/csvUpload.json'
    };

    var EzBizAppService = {
        selectedSubOrgId: '',
        start: function() {
            EzBizAppService.getSubOrganizations();
            $('#importCancelButton').click(function(){
                EzBizAppService.hideImportForm();
            });
        },
        getSubOrganizations: function() {
            EzWebAppClient.callApiService(EzConfigApiUrl.GET_SUB_ORGANIZATIONS, {});
        },
        uploadForm: function(subOrgId, subOrgName) {
            EzBizAppService.selectedSubOrgId = subOrgId;
            EzBizAppService.showImportForm(subOrgName);
        },
        handleApiBizResult: function(url, response) {
            if (url === EzConfigApiUrl.GET_SUB_ORGANIZATIONS) {
                EzBizAppService.parseSubOrgItemHTML(response.data);
            }
        },
        parseSubOrgItemHTML: function(data) {
            for (const [key, value] of Object.entries(data)) {
                let itemRow = $.parseHTML(''+
                    '<a class="btn-sub-org-upload" href="#" onclick="EzBizAppService.uploadForm(\''+ key +'\',\''+ value +'\')">'+
                        '<div class="col-lg-3 col-md-3 col-sm-6 col-xs-12">'+
                            '<div class="card corner-radius demo-color-box bg-blue waves-effect col-lg-12 col-md-12 col-sm-12 col-xs-12">'+
                                '<br>'+
                                '<div class="color-name uppercase"></div>'+
                                '<div class="color-name"><i class="material-icons">groups</i></div>'+
                                '<div class="color-class-name">'+ value +'</div>'+
                                '<br>'+
                            '</div>'+
                        '</div>'+
                    '</a>'+
                '');
                $('#dashboard-container').append(itemRow);
            }
        },
        showImportForm: function(subOrgName) {
            $('#modal-import-form').removeClass('fade');
            $('#modal-import-form').addClass('show');
            $('#upload-title').html(subOrgName);
        },
        hideImportForm: function() {
            $('#modal-import-form').removeClass('show');
            $('#modal-import-form').addClass('fade');
        },
        resetImportForm: function() {
            $('#importFile').val('');
            $('#importCancelButton').show();
            $('#importSubmitButton').show();
            $('#importLoader').hide();
        },
        submitImportForm: function() {
            $('#importCancelButton').hide();
            $('#importSubmitButton').hide();
            $('#importLoader').show();
            let postData = {
                orgId : $('#orgId').val(),
                subOrgId : $('#subOrgId').val(),
                fileId : $('#fileId').val(),
                scene : $('#importScene').val()
            };
            EzWebAppClient.postMultipartForm('importForm', postData, EzConfigApiUrl.CSV_UPLOAD_URL, 'IMPORT_FILE');
        }
    };

    $(document).ready(function(){
        EzWebAppClient.onApiBizSuccess(function(url, response){
            EzBizAppService.handleApiBizResult(url, response);
        });
        EzWebAppClient.onApiBizFailed(function(url, message){
            EzWebAppViewHelper.showModalAlert(
                'API Biz Failed',
                message,
                function(){}
            );
        });
        EzWebAppClient.onApiCallError(function(xhr){
            EzWebAppViewHelper.showModalAlert(
                'Application Error',
                xhr.responseText,
                function(){}
            );
        });
        EzWebAppClient.onReady(function(){
            EzBizAppService.start();
        });
        EzWebAppClient.start();
    });
</script>
