<section class="content">
    <ol class="breadcrumb breadcrumb-offset">
        <li><a href="home.htm">Dashboard</a></li>
        <li class="active">Manage Members</a></li>
    </ol>

    <div class="container-fluid">
        <div class="row clearfix">
            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="card corner-radius">
                    <div class="header">
                        <h2>MANAGE MEMBERS</h2>
                        <div class="header-dropdown m-r--5">
                            <a href="javascript:void(0)">
                                <button id="form-add-new-btn" type="button" class="button button-rounded btn-offset waves-effect waves-float">ADD</button>
                            </a>
                        </div>
                    </div>

                    <div style="margin-top: -10px;" class="body table-responsive">
                        <table class="table table-hover table-striped">
                            <thead>
                            <tr>
                                <th width="5%">No</th>
                                <th width="20%">Community</th>
                                <th width="20%">Name</th>
                                <th width="15%">Phone</th>
                                <th width="15%">NIK</th>
                                <th width="30%">Address</th>
                                <th width="10%" class="text-center">Detail</th>
                            </tr>
                            </thead>
                            <tbody id="rowsContainer"></tbody>
                        </table>
                        <ul class="pager"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="modal-form-new" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="largeModalLabel">Create New Community</h4>
            </div>
            <div class="modal-body">
                <div class="row clearfix">
                    <div class="form-group form-float col-sm-12">
                        <div class="form-line">
                            <div class="font-12">Community Name</div>
                            <input type="text" class="form-control" id="name" placeholder="Community Name" required>
                        </div>
                    </div>
                    <div class="form-group form-float col-sm-12">
                        <div class="form-line">
                            <div class="font-12">Community Address</div>
                            <input type="text" class="form-control" id="address" placeholder="Community Address" required>
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <button id="submitButton" class="button button-rounded waves-effect waves-float pull-right" type="submit" name="submit">SUBMIT</button>
                        <button id="cancelButton" class="button button-rounded button-light waves-effect waves-float pull-right" type="submit" name="submit">CANCEL</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    var EzAdminUrl = {
        MEMBERS_GET: 'api/members.json',
        MEMBER_CREATE: 'api/createMember.json'
    };
    var EzDashboardBizService = {
        start: function() {
            EzDashboardBizService.fetchData();
        },
        fetchData: function() {
            EzWebAppClient.callApiService(EzAdminUrl.MEMBERS_GET, {
                pageNumber: EzDashboardBizService.data.pageNumber,
                pageSize: EzDashboardBizService.data.pageSize
            });
        },
        handleApiBizResult: function(url, response) {
            if (url === EzAdminUrl.MEMBERS_GET) {
                EzDashboardBizService.reloadPageResultView(response);
            }
            if (url === EzAdminUrl.MEMBER_CREATE) {
                alert(response.data);
                EzDashboardBizService.hideFormNewImage();
                EzDashboardBizService.fetchData();
            }
        },
        handleApiBizFailed: function(url, message) {
            if (url === EzAdminUrl.MEMBER_CREATE) {
                alert(message);
            }
        },
        reloadPageResultView: function(response) {
            $('#rowsContainer').html('');
            for(let i=0; i<response.pageResult.data.length; i++) {
                let rowNum = i + 1;
                let rowData = response.pageResult.data[i];
                let itemRow = $.parseHTML(DashTemplate);
                $(itemRow).find('.colNum').html(rowNum);
                $(itemRow).find('.colComm').html(rowData.subOrgName);
                $(itemRow).find('.colName').html(rowData.name);
                $(itemRow).find('.colPhone').html(rowData.phone);
                $(itemRow).find('.colCreate').html(rowData.createdTime);
                $(itemRow).find('.colStatus').html(rowData.status);
                $('#rowsContainer').append(itemRow);
            }
            $('.pager').html(EzWebAppClient.renderPager(response.pageResult));
        },
        submitCreate: function() {
            EzWebAppClient.callApiService(EzAdminUrl.SUB_ORGANIZATIONS_CREATE, {
                name : $('#name').val(),
                address : $('#address').val()
            });
        },
        showFormNewImage: function() {
            $('#modal-form-new').removeClass('fade');
            $('#modal-form-new').addClass('show');
        },
        hideFormNewImage: function() {
            $('#modal-form-new').removeClass('show');
            $('#modal-form-new').addClass('fade');
        },
        prev: function() {
            EzDashboardBizService.data.pageNumber--;
            EzDashboardBizService.fetchNews();
        },
        next: function() {
            EzDashboardBizService.data.pageNumber++;
            EzDashboardBizService.fetchNews();
        },
        data: {
            pageNumber: 1,
            pageSize: 20,
            result: null
        }
    };

    $(document).ready(function(){
        EzWebAppClient.onApiBizSuccess(function(url, response){
            EzDashboardBizService.handleApiBizResult(url, response);
        });
        EzWebAppClient.onApiBizFailed(function(url, message){
            EzDashboardBizService.handleApiBizFailed(url, message);
        });
        EzWebAppClient.onApiCallError(function(xhr){
            console.log(xhr);
        });
        EzWebAppClient.onReady(function(){
            EzDashboardBizService.start();
        });
        EzWebAppClient.onPrev(function(){
            EzDashboardBizService.prev();
        });
        EzWebAppClient.onNext(function(){
            EzDashboardBizService.next();
        });
        EzWebAppClient.start();

        $('#form-add-new-btn').click(function(){
            EzDashboardBizService.showFormNewImage();
        });
        $('#cancelButton').click(function(){
            EzDashboardBizService.hideFormNewImage();
        });
        $('#submitButton').click(function(){
            EzDashboardBizService.submitCreate();
        });
    });

    var DashTemplate = ''+
        '<tr>'+
            '<td class="colNum" style="vertical-align: middle;"></td>'+
            '<td class="colComm" style="vertical-align: middle;"></td>'+
            '<td class="colName" style="vertical-align: middle;"></td>'+
            '<td class="colPhone" style="vertical-align: middle;"></td>'+
            '<td class="colCreate" style="vertical-align: middle;"></td>'+
            '<td class="colStatus text-center" style="vertical-align: middle;"></td>'+
        '</tr>';

</script>
