spring.application.name = ezserviceapp

server.port=${EZCONF_SERVER_PORT}
server.ssl.enabled=true
server.ssl.key-store=${EZCONF_SERVER_SSL_KEYSTORE}
server.ssl.key-store-type=${EZCONF_SERVER_SSL_KEYSTORE_TYPE}
server.ssl.key-store-password=${EZCONF_SERVER_SSL_KEYSTORE_PASS}

# database setup
spring.datasource.url=jdbc:mysql://${EZCONF_DATABASE_HOST}:${EZCONF_DATABASE_PORT}/${EZCONF_DATABASE_NAME}
spring.datasource.username=${EZCONF_DATABASE_USER}
spring.datasource.password=${EZCONF_DATABASE_PASS}
#spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect

#spring.jpa.properties.hibernate.show_sql=true
#logging.level.org.hibernate.type.descriptor.sql=trace

#jetty access log
server.jetty.accesslog.enabled=true
logging.level.org.eclipse.jetty=INFO
server.jetty.accesslog.filename=${EZCONF_LOGGING_APP_ROOT_PATH}/access.log.yyyy_MM_dd
server.jetty.accesslog.file-date-format=yyyy_MM_dd

#custom logback config
logging.app.log_level=${EZCONF_LOGGING_APP_LOG_LEVEL}
logging.app.root_path=${EZCONF_LOGGING_APP_ROOT_PATH}
logging.app.log_type=${EZCONF_LOGGING_APP_LOG_TYPE}